name: Build macOS Audio Units

on:
  push:
    tags: ['v1.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          echo "name=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          submodules: recursive
          persist-credentials: false
      - name: Build Universal Audio Units
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DZYV_BUILD_FX=ON -DZYV_BUILD_INST=ON -DZYV_BUILD_MIDI=ON
          cmake --build build --parallel 3 --target HybridFxA_AU HybridInstA_AU HybridMidiA_AU
      - name: Verify and package
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist "$RUNNER_TEMP/zyvst-source/third_party/JUCE"
          while IFS='|' read -r target product slug; do
            bundle="build/plugin/${target}_artefacts/Release/AU/$product.component"
            codesign --verify --strict "$bundle"
            lipo "$bundle/Contents/MacOS/$product" -verify_arch arm64 x86_64
            installed_version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$bundle/Contents/Info.plist")"
            test "$installed_version" = "$version"
            ditto -c -k --keepParent "$bundle" "dist/$slug-$version-macOS-universal-AU.zip"
          done <<'AUS'
          HybridFxA|zyvst_fx|zyvst_fx
          HybridInstA|zyvst_inst|zyvst_inst
          HybridMidiA|zyvst_midi|zyvst_midi
          AUS
          git archive HEAD | tar -x -C "$RUNNER_TEMP/zyvst-source"
          git -C third_party/JUCE archive HEAD | tar -x -C "$RUNNER_TEMP/zyvst-source/third_party/JUCE"
          tar -czf "dist/zyvst-$version-source.tar.gz" -C "$RUNNER_TEMP" zyvst-source
          (cd dist && shasum -a 256 -- *.zip *.tar.gz > SHA256SUMS.txt)
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          printf '<img src="https://raw.githubusercontent.com/%s/%s/assets/zyvst-hero.png" alt="zyvst" width="1255">\n\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" > "$RUNNER_TEMP/release.md"
          cat README.md | sed '1,/^# zyvst$/d' | sed '/^\[Download zyvst v[0-9.]* for macOS\]/d' >> "$RUNNER_TEMP/release.md"
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "zyvst $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release.md"
